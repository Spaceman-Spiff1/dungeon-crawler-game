[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeon-crawler-game"
version = "0.1.0"
description = "A database-backed Python dungeon crawler prototype."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Local Project" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]